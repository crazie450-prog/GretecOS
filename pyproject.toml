[project]
name = "gregtec-os"
version = "0.0.0"
description = "Local voice assistant and planning suite for GT New Horizons 2.9."
# PM01: Python 3.12, because Kokoro and RealtimeSTT need <3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.4.0",
    "claude-agent-sdk>=0.2.176",
    "fastapi>=0.162.0",
    # WO-7.3: the core checks every OC bridge message against docs/contracts/oc_bridge.schema.json
    # (gregtec.bridge.ingest); tests/oc uses it too. Already installed through mcp.
    "jsonschema>=4.26",
    "keyring>=25.7.0",
    # WO-5.7, D248: gos voice benchmark's RAM of the core and voice processes (BSD-3-Clause).
    # Core only: the voice package never reads other processes (D247's audit).
    "psutil>=7.0",
    # WO-3.4, D192: the planner's staged MILP (scipy.optimize.milp on HiGHS; BSD-3-Clause).
    "scipy>=1.16",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
gos = "gregtec.cli:main"

[project.gui-scripts]
# WO-2.1, D116: the login Run key starts this windowless launcher (pythonw on Windows).
gos-supervisor = "gregtec.supervisor:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Appendix B layout: the package lives in core/gregtec/.
module-root = "core"
module-name = "gregtec"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=9.2",
    # Ruff changed its default rule set in 0.16 and 0.17; take minor bumps on purpose.
    "ruff>=0.17.3,<0.18",
]
# WO-5.1, D179: the voice client (voice/, a workspace package). A default group, so GOS_APP
# (`uv sync --no-dev`) and CI get it; it stays light: its own extra dependencies are
# Windows-only (sounddevice, pynput). Heavy engines (STT, TTS, wake word) get groups of their own.
voice = ["gregtec-voice"]
# WO-5.2, D182: speech-to-text engines (faster-whisper on CTranslate2, Parakeet through
# onnx-asr), both MIT; models download at runtime to GOS_HOME/models. Not a default group (CI
# and dev clones stay light); gos deploy adds it, so GOS_APP has them.
stt = ["faster-whisper>=1.2.1", "onnx-asr[cpu,hub]>=0.12.0"]
# WO-5.4, D185: the wake word: sherpa-onnx keyword spotting, and sentencepiece, which spells the
# phrase in the model's word pieces (both Apache-2.0). A custom openWakeWord model runs on ONNX
# Runtime (from the stt group, with the VAD and the second stage); the openwakeword package
# isn't used (on Linux it needs tflite-runtime, which has no Python 3.12 wheel). gos deploy adds it.
wake = ["sherpa-onnx>=2.0.1", "sentencepiece>=0.2.1"]
# WO-5.3, D203: text-to-speech. kokoro-onnx (MIT) runs Kokoro and, through the same ONNX Runtime
# and phonemizer, GOS's own Piper runner; its phonemizer and espeak-ng are GPL-3.0, installed
# from PyPI as libraries, never vendored (D203, a PR question). gos deploy adds it.
tts = ["kokoro-onnx>=0.6.1"]

[tool.uv]
default-groups = ["dev", "voice"]

[tool.uv.workspace]
members = ["voice"]

[tool.uv.sources]
gregtec-voice = { workspace = true }

[tool.ruff]
src = ["core", "voice"]  # first-party: gregtec and gregtec_voice (D179)
# Ruff formats Python blocks inside Markdown by default; keep it off CLAUDE.md, README.md and docs/.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Ruff's default rules plus flake8-annotations, for "type hints everywhere" (CLAUDE.md).
extend-select = ["ANN"]

[tool.pytest]
testpaths = ["tests"]
# importlib mode lets tests/unit, tests/security, ... share file names without __init__.py files.
addopts = ["--import-mode=importlib"]
strict = true
markers = ["slow: needs a downloaded speech model; skipped unless one is present (WO-5.2)"]
