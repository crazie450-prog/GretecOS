[project]
name = "gregtec-os"
version = "0.0.0"
description = "Local voice assistant and planning suite for GT New Horizons 2.9."
# PM01: Python 3.12, because Kokoro and RealtimeSTT need <3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.4.0",
    "claude-agent-sdk>=0.2.176",
    "fastapi>=0.162.0",
    # WO-7.3: the core checks every OC bridge message against docs/contracts/oc_bridge.schema.json
    # (gregtec.bridge.ingest); tests/oc uses it too. Already installed through mcp.
    "jsonschema>=4.26",
    "keyring>=25.7.0",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
gos = "gregtec.cli:main"

[project.gui-scripts]
# WO-2.1, D116: the login Run key starts this windowless launcher (pythonw on Windows).
gos-supervisor = "gregtec.supervisor:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Appendix B layout: the package lives in core/gregtec/.
module-root = "core"
module-name = "gregtec"

[dependency-groups]
dev = [
    "pytest>=9.2",
    # Ruff changed its default rule set in 0.16 and 0.17; take minor bumps on purpose.
    "ruff>=0.17.3,<0.18",
]

[tool.ruff]
src = ["core"]
# Ruff formats Python blocks inside Markdown by default; keep it off CLAUDE.md, README.md and docs/.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Ruff's default rules plus flake8-annotations, for "type hints everywhere" (CLAUDE.md).
extend-select = ["ANN"]

[tool.pytest]
testpaths = ["tests"]
# importlib mode lets tests/unit, tests/security, ... share file names without __init__.py files.
addopts = ["--import-mode=importlib"]
strict = true
