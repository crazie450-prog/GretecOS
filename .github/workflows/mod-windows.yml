name: mod (Windows)

# D98: deploy builds GregtecLink with gradlew.bat on Clayton's PC; this runs that build on Windows.
# It takes 10-15 minutes, so it runs only when the mod or the deploy code changes (Clayton, 2026-11-06).
on:
  push:
    branches: [main]
    paths:
      - "mod/**"
      - "core/gregtec/deploy.py"
      - "tests/unit/test_deploy.py"
      - ".github/workflows/mod-windows.yml"
  pull_request:
    paths:
      - "mod/**"
      - "core/gregtec/deploy.py"
      - "tests/unit/test_deploy.py"
      - ".github/workflows/mod-windows.yml"

permissions:
  contents: read

jobs:
  mod-windows:
    # D98: gos deploy builds GregtecLink with gradlew.bat on Clayton's PC. The same code
    # (deploy._build_mod: build, JUnit, spotless, keep the jar, delete the rest) on a git archive
    # of this commit, which has no .git, on Windows.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked pytest -rs tests/unit/test_deploy.py -k test_the_real_mod_builds_from_a_git_archive
        env:
          GOS_REAL_MOD_BUILD: "1"
