name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Windows: GOS only runs there. Linux: cloud dev sessions run there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      # Managed CPython 3.12 from .python-version, the same kind uv installs on the PC.
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked ruff check --output-format=github .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
        env:
          # WO-0.8: lets tests/security/test_gos_dev_setup.py create a user and change ACLs.
          # Only the ephemeral Windows runner sets it; never set it on a real PC.
          GOS_ISOLATION_CI: ${{ runner.os == 'Windows' && runner.environment == 'github-hosted' && '1' || '' }}

  dashboard:
    # WO-2.6: the dashboard (React + Vite + TypeScript, pnpm). Install from the lockfile, typecheck
    # and build, the unit tests (vitest), deploy's real build of a git archive of this commit (as
    # gos deploy runs it), then the end-to-end tests: Playwright's Chromium against a real core with
    # a fake fast lane, at 2560x1440 (monitor 2) and 390x844 (the phone). Screenshots are uploaded
    # as an artifact, never committed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The version package.json's packageManager names.
      - run: npm install -g pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv python install
        working-directory: .
      - run: uv sync --locked
        working-directory: .
      - run: uv run --locked pytest -rs tests/unit/test_deploy.py -k test_the_real_dashboard_builds_from_a_git_archive
        working-directory: .
        env:
          GOS_REAL_DASHBOARD_BUILD: "1"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-e2e
          path: |
            dashboard/test-results/
            dashboard/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  mod:
    # WO-1.1: GregtecLink build, then the headless harness (dev server, scripted export, checks, exit),
    # then the client harness (dev client under Xvfb: autoexport world, export, NEI's dump, checks, exit).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gtnhgradle derives the mod version from git history.
          fetch-depth: 0
      # As GTNH's own CI: Gradle runs on 25, Minecraft on 8.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon build
      - run: timeout 1500 ./gradlew --no-daemon runServer -Pharness
      # Java 25 with lwjgl3ify, as GTNH's Java 17+ build on the PC. LWJGL needs xrandr (x11-xserver-utils).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-xserver-utils libgl1-mesa-dri libegl1 libegl-mesa0
      - run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" timeout 1500 ./gradlew --no-daemon runClient25 -Pharness
      # WO-1.3: keep that client run and export again (the harness wipes its own runs), so the
      # integration tests can check that two exports of one pack give the same recipe keys.
      - run: mkdir -p run/client-b/gregteclink && cp -r run/client/gregteclink/exports run/client-b/gregteclink/
      - run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" timeout 1500 ./gradlew --no-daemon runClient25 -Pharness
      # WO-1.2: `gos export collect` on the two runs the harnesses just wrote (tests/integration).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv python install
        working-directory: .
      - run: uv run --locked pytest tests/integration
        working-directory: .
        env:
          GOS_REQUIRE_HARNESS_RUN: "1"
          GOS_CLIENT_RUN_B: mod/run/client-b
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-logs
          path: |
            mod/run/server/logs/
            mod/run/server/crash-reports/
            mod/run/server/gregteclink/harness-result.json
            mod/run/server/gregteclink/exports/*/manifest.json
            mod/run/client/logs/
            mod/run/client/crash-reports/
            mod/run/client/gregteclink/harness-result.json
            mod/run/client/gregteclink/exports/*/manifest.json
          if-no-files-found: ignore
