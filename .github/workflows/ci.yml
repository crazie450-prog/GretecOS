name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Windows: GOS only runs there. Linux: cloud dev sessions run there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      # Managed CPython 3.12 from .python-version, the same kind uv installs on the PC.
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked ruff check --output-format=github .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
        env:
          # WO-0.8: lets tests/security/test_gos_dev_setup.py create a user and change ACLs.
          # Only the ephemeral Windows runner sets it; never set it on a real PC.
          GOS_ISOLATION_CI: ${{ runner.os == 'Windows' && '1' || '' }}
