name: WO-11.4 repeat (temporary)

# WO-11.4 TEMPORARY: runs the CI repeat offenders 50 times under load, the origin/main versions
# (tests/**/test_zz_before_*.py) beside the fixed ones. Removed before the PR.
on:
  push:
    branches: [wo/11.4-ci-repeat-offenders]

permissions:
  contents: read

jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv python install
      - run: uv sync --locked
      - name: after, 50x, 4 workers + 2 busy loops
        run: >-
          bash ci_tmp_wo114/run.sh 50 after -n 4
          "tests/unit/watchers/test_census.py::test_a_chunk_too_big_for_one_event_is_split_and_reaches_my_base"
          "tests/unit/watchers/test_census.py::test_events_are_packed_under_the_byte_budget"
          "tests/security/test_oc_bridge_api.py::test_saying_confirm"
          "tests/unit/discordbot/test_core_api.py::test_errors_carry_the_core_s_status_and_reason"
          "tests/unit/tools/test_tool_ops.py::test_telemetry_get"
          "tests/unit/test_appwindow.py::test_the_foreground_program_on_windows"
          "tests/unit/planner/test_design_job_api.py::test_the_designer_job_api"
          "tests/unit/test_playhooks.py::test_export_waits_for_a_launch_to_start_its_client"
          "tests/unit/watchers/test_with_play.py::test_gos_watch_run_spools_events"
          "tests/unit/alerts/test_core_routing.py::test_the_paused_game_comes_from_the_watchers_feed"
          "tests/unit/alerts/test_core_routing.py::test_without_a_router_the_engines_push_speaks_as_before"
          "tests/unit/test_extractor.py::test_run_tree_stops_what_the_command_started"
      - name: before (origin/main's tests), 50x, 4 workers + 2 busy loops
        if: ${{ !cancelled() }}
        run: >-
          bash ci_tmp_wo114/run.sh 50 before -n 4
          "tests/unit/watchers/test_zz_before_census.py::test_a_chunk_too_big_for_one_event_is_split_and_reaches_my_base"
          "tests/unit/watchers/test_zz_before_census.py::test_events_are_packed_under_the_byte_budget"
          "tests/security/test_zz_before_oc_bridge_api.py::test_saying_confirm"
          "tests/unit/tools/test_zz_before_tool_ops.py::test_telemetry_get"
          "tests/unit/test_zz_before_appwindow.py::test_the_foreground_program_on_windows"
          "tests/unit/planner/test_zz_before_design_job_api.py::test_the_designer_job_api"
          "tests/unit/test_zz_before_playhooks.py::test_export_waits_for_a_launch_to_start_its_client"
          "tests/unit/watchers/test_zz_before_with_play.py::test_gos_watch_run_spools_events"
          "tests/unit/alerts/test_zz_before_core_routing.py::test_the_paused_game_comes_from_the_watchers_feed"
      - name: extractor tree stop, 150x more (Linux), 4 workers + 2 busy loops
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: >-
          bash ci_tmp_wo114/run.sh 150 extractor -n 4 -s
          "tests/unit/test_extractor.py::test_run_tree_stops_what_the_command_started"
          && grep -B2 -A60 "^stat " out-extractor.txt | head -400 || true
      - name: serial ones (the mailbox stress tests, the real keyboard hook), 25x / 50x alone
        if: ${{ !cancelled() }}
        run: |
          bash ci_tmp_wo114/run.sh 25 stress -m serial tests/unit/test_oc_mailbox_stress.py -k "concurrent_writer or withdrawn"
          bash ci_tmp_wo114/run.sh 50 ptt -m serial "tests/unit/voice/test_ptt.py::test_the_real_hook_sees_an_injected_key"
