name: WO-11.4 repeat (temporary)

# WO-11.4 TEMPORARY: measures test_the_designer_job_api's median request pair on the runners
# (busy job, idle job, the switch-interval mutation), alone and under load. Removed before the PR.
on:
  push:
    branches: [wo/11.4-ci-repeat-offenders]

permissions:
  contents: read

jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv python install
      - run: uv sync --locked
      - run: bash ci_tmp_wo114/make.sh
      - name: alone
        run: |
          bash ci_tmp_wo114/run.sh 20 busy-alone 0 tests/unit/planner/test_zz_busy_design_job_api.py::test_the_designer_job_api
          bash ci_tmp_wo114/run.sh 10 idle-alone 0 tests/unit/planner/test_zz_idle_design_job_api.py::test_the_designer_job_api
          bash ci_tmp_wo114/run.sh 3 mut-alone 0 tests/unit/planner/test_zz_mut_design_job_api.py::test_the_designer_job_api
      - name: under load, 4 workers + 2 busy loops
        if: ${{ !cancelled() }}
        run: |
          bash ci_tmp_wo114/run.sh 50 busy-load 1 -n 4 tests/unit/planner/test_zz_busy_design_job_api.py::test_the_designer_job_api
          bash ci_tmp_wo114/run.sh 8 mut-load 1 -n 4 tests/unit/planner/test_zz_mut_design_job_api.py::test_the_designer_job_api
