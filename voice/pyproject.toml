[project]
name = "gregtec-voice"
version = "0.0.0"
description = "Gregtec OS voice client: capture, talk key, hotkeys and the core connection (WO-5.1)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # config, keyring tokens, logging and the core's HTTP conventions (this workspace's root)
    "gregtec-os",
    # WASAPI capture through PortAudio (MIT); the Windows wheel bundles PortAudio (D181).
    "sounddevice>=0.5.6; sys_platform == 'win32'",
    # The low-level keyboard hook. LGPL-3.0: installed from PyPI as a library, never vendored
    # or modified (D180).
    "pynput>=1.8.2; sys_platform == 'win32'",
    # The screen key's one frame (WO-8.2, D288): DXGI Desktop Duplication, MIT; the Windows
    # wheels bundle its compiled NumPy kernels, so no OpenCV is needed.
    "dxcam>=0.3.0; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Appendix B layout: voice/gregtec_voice/ (flat).
module-root = ""
module-name = "gregtec_voice"

[tool.uv.sources]
gregtec-os = { workspace = true }
