# Test fixture shaped like GTNH 2.9.0's config/OpenComputers.cfg: the same keys, nesting and
# shipped values for the internet section; other sections and the original comments left out.
opencomputers {
  internet {

    # unused since filteringRules replaced it
    blacklist=[]

    enableHttp=true

    # the shipped rules: loopback and private ranges are blocked
    filteringRules=[
      "deny ip:127.0.0.0/8",
      "deny ip:10.0.0.0/8",
      "deny ip:192.168.0.0/16",
      "deny ip:172.16.0.0/12",
      removeme,
      "deny private",
      "deny bogon",
      "allow default"
    ]

    maxTcpConnections=4

    # 0 = never time out
    requestTimeout=0

    threads=4

    # unused since filteringRules replaced it
    whitelist=[]
  }
}
