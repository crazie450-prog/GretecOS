# Excerpt of GTNH 2.9.0 config/lwjgl3ify.cfg; unrelated sections removed.

window {
    # Changes the application ID used for categorizing windows in window managers, saving per-app settings etc. [default: com.gtnewhorizons.Lwjgl3ifyMinecraft]
    S:appId=com.gtnewhorizons.Lwjgl3ifyMinecraft

    # Should exclusive fullscreen mode replaced with borderless fullscreen mode [default: false]
    B:borderless=false

    # Windows-only - should borderless window have height increased by 1 to solve flickering on un-focusing [default: true]
    B:borderlessWindowsCompatibility=true

    # Start centered? [default: true]
    B:centered=true
    S:cocoaFrameName=minecraft

    # Should the window have decorations (titlebar, border, close button) [default: true]
    B:decorated=true

    # Start focused? [default: true]
    B:focused=true

    # Enables high DPI rendering in the window, make sure to increase your GUI scale in options if enabled [default: true]
    B:hidpiRendering=true

    # Start iconified? [default: false]
    B:iconified=false

    # On Linux only, creates a hidden .desktop file in your XDG_DATA_HOME/applications folder matching the appId to improve Wayland support [default: true]
    B:linuxCreateAppDesktopEntry=true

    # Start maximized? [default: false]
    B:maximized=false

    # Show game loading progress in the task bar on supported systems [default: true]
    B:showLoadingProgress=true
    S:waylandAppId=minecraft
    S:x11ClassName=minecraft
}
